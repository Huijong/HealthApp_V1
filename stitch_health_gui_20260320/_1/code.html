<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#22C55E",
                        "background-light": "#F2F2F2",
                        "background-dark": "#0A0A0A",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1.25rem",
                        "2xl": "1.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            min-height: 100dvh;
        }
        /* One UI style input resets */
        input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0;
            position: absolute;
            right: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- TopAppBar: Samsung One UI style with title next to back arrow -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<div class="flex items-center px-4 h-16 max-w-md mx-auto w-full">
<button class="text-slate-900 dark:text-slate-100 flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight ml-2">신체 정보 입력</h2>
</div>
</header>
<!-- Content -->
<main class="flex-1 overflow-y-auto px-6 py-4 max-w-md mx-auto w-full space-y-10">
<!-- Main Title (Large Style) -->
<!-- Gender Selection Card -->
<section class="space-y-4">
<h3 class="text-sm font-bold text-slate-500 dark:text-slate-400 ml-1 uppercase tracking-wider">성별</h3>
<div class="bg-white dark:bg-slate-900 rounded-2xl p-1.5 shadow-sm flex border border-slate-200/50 dark:border-slate-800">
<label class="flex cursor-pointer h-12 flex-1 items-center justify-center overflow-hidden rounded-[1.25rem] px-2 transition-all has-[:checked]:bg-primary has-[:checked]:text-white text-slate-600 dark:text-slate-400 font-bold">
<span>남성</span>
<input checked="" class="hidden" name="gender" type="radio" value="male"/>
</label>
<label class="flex cursor-pointer h-12 flex-1 items-center justify-center overflow-hidden rounded-[1.25rem] px-2 transition-all has-[:checked]:bg-primary has-[:checked]:text-white text-slate-600 dark:text-slate-400 font-bold">
<span>여성</span>
<input class="hidden" name="gender" type="radio" value="female"/>
</label>
</div>
</section>
<!-- Birthday Selection Card -->
<section class="space-y-4">
<h3 class="text-sm font-bold text-slate-500 dark:text-slate-400 ml-1 uppercase tracking-wider">생년월일</h3>
<div class="relative bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200/50 dark:border-slate-800">
<input class="w-full h-16 bg-transparent border-none rounded-2xl px-5 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/50 text-lg font-medium" type="date" value="1995-01-01"/>
<div class="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none text-primary">
<span class="material-symbols-outlined">calendar_today</span>
</div>
</div>
</section>
<!-- Height & Weight Cards -->
<section class="grid grid-cols-2 gap-4">
<div class="space-y-4">
<h3 class="text-sm font-bold text-slate-500 dark:text-slate-400 ml-1 uppercase tracking-wider">키</h3>
<div class="relative bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200/50 dark:border-slate-800">
<input class="w-full h-16 bg-transparent border-none rounded-2xl px-5 pr-14 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/50 text-lg font-medium" placeholder="000" type="number"/>
<span class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 font-medium">cm</span>
</div>
</div>
<div class="space-y-4">
<h3 class="text-sm font-bold text-slate-500 dark:text-slate-400 ml-1 uppercase tracking-wider">몸무게</h3>
<div class="relative bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200/50 dark:border-slate-800">
<input class="w-full h-16 bg-transparent border-none rounded-2xl px-5 pr-14 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary/50 text-lg font-medium" placeholder="00" type="number"/>
<span class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 font-medium">kg</span>
</div>
</div>
</section>
<!-- Information Card -->
<div class="pt-2">
<div class="w-full rounded-2xl bg-white dark:bg-slate-900 p-8 flex flex-col items-center justify-center border border-slate-200/50 dark:border-slate-800 shadow-sm">
<div class="text-center space-y-4">
<div class="size-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto">
<span class="material-symbols-outlined text-3xl text-primary">fitness_center</span>
</div>
<p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed max-w-[200px] mx-auto">정확한 정보를 입력하면 맞춤형 분석이 가능합니다</p>
</div>
</div>
</div>
</main>
<!-- Footer: Floating Samsung-style button -->
<footer class="p-6 max-w-md mx-auto w-full">
<button class="w-full h-14 bg-primary hover:bg-primary/90 text-white font-bold rounded-full shadow-lg shadow-primary/30 transition-all active:scale-[0.97] text-lg">
            저장하기
        </button>
</footer>
</body></html>
