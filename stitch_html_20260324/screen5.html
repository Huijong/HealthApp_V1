<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#22C55E",
                        "background-light": "#F2F2F7",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Manrope", "Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1.5rem",
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* One UI specific shadow */
        .one-ui-card {
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- One UI Large Header Style -->
<header class="sticky top-0 z-10 bg-background-light dark:bg-background-dark px-6 pt-8 pb-4 transition-all duration-300">
<div class="flex items-center justify-between mb-6"><div class="flex items-center gap-2">
<button class="text-slate-900 dark:text-white p-2 -ml-2">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<span class="text-lg font-bold text-slate-900 dark:text-white">결과 제출</span>
</div>
<button class="text-slate-900 dark:text-white p-2 -mr-2">
<span class="material-symbols-outlined text-2xl">settings</span>
</button></div>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-6 pb-12 space-y-4">
<!-- Notice Section - Samsung Style Rounded Card -->
<div class="bg-white dark:bg-slate-900 rounded-[1.5rem] p-6 one-ui-card">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="bg-green-50 dark:bg-green-900/30 text-primary p-3 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined font-bold">campaign</span>
</div>
<div>
<div class="flex items-center gap-2">
<p class="font-bold text-slate-900 dark:text-white text-lg">공지 사항</p>
<span class="h-1.5 w-1.5 rounded-full bg-primary"></span>
</div>
<p class="text-xs text-slate-400 dark:text-slate-500 font-semibold tracking-wider">NOTICE &amp; UPDATES</p>
</div>
</div>
<button class="bg-primary hover:bg-primary/90 text-white px-6 py-2.5 rounded-full text-sm font-bold transition-all active:scale-95">
                보기
            </button>
</div>
</div>
<!-- Section Label -->
<div class="px-2 pt-4 pb-2">
<span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">Exercise List</span>
</div>
<!-- Activity Item 1: Treadmill Walk -->
<div class="bg-white dark:bg-slate-900 rounded-[1.5rem] p-5 flex items-center justify-between one-ui-card">
<div class="flex items-center gap-4">
<div class="bg-slate-50 dark:bg-slate-800 text-primary p-3 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined">directions_walk</span>
</div>
<div>
<p class="font-bold text-slate-900 dark:text-white text-[17px]">러닝머신 걷기</p>
<p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Treadmill Walk</p>
</div>
</div>
<div class="flex items-center gap-3">
<span class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-4 py-1.5 rounded-full text-sm font-bold">3</span>
<button class="bg-primary text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition-colors active:opacity-80">
                제출
            </button>
</div>
</div>
<!-- Activity Item 2: Treadmill Run -->
<div class="bg-white dark:bg-slate-900 rounded-[1.5rem] p-5 flex items-center justify-between one-ui-card">
<div class="flex items-center gap-4">
<div class="bg-slate-50 dark:bg-slate-800 text-primary p-3 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined">directions_run</span>
</div>
<div>
<p class="font-bold text-slate-900 dark:text-white text-[17px]">러닝머신 달리기</p>
<p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Treadmill Run</p>
</div>
</div>
<div class="flex items-center gap-3">
<span class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-4 py-1.5 rounded-full text-sm font-bold">5</span>
<button class="bg-primary text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition-colors active:opacity-80">
                제출
            </button>
</div>
</div>
<!-- Activity Item 3: Outdoor Walk -->
<div class="bg-white dark:bg-slate-900 rounded-[1.5rem] p-5 flex items-center justify-between one-ui-card">
<div class="flex items-center gap-4">
<div class="bg-slate-50 dark:bg-slate-800 text-primary p-3 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined">nature_people</span>
</div>
<div>
<p class="font-bold text-slate-900 dark:text-white text-[17px]">야외 걷기</p>
<p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Outdoor Walk</p>
</div>
</div>
<div class="flex items-center gap-3">
<span class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-4 py-1.5 rounded-full text-sm font-bold">10000</span>
<button class="bg-primary text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition-colors active:opacity-80">
                제출
            </button>
</div>
</div>
<!-- Activity Item 4: Outdoor Run -->
<div class="bg-white dark:bg-slate-900 rounded-[1.5rem] p-5 flex items-center justify-between one-ui-card">
<div class="flex items-center gap-4">
<div class="bg-slate-50 dark:bg-slate-800 text-primary p-3 rounded-2xl flex items-center justify-center">
<span class="material-symbols-outlined">terrain</span>
</div>
<div>
<p class="font-bold text-slate-900 dark:text-white text-[17px]">야외 달리기</p>
<p class="text-xs text-slate-400 dark:text-slate-500 font-medium">Outdoor Run</p>
</div>
</div>
<div class="flex items-center gap-3">
<span class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-4 py-1.5 rounded-full text-sm font-bold">4</span>
<button class="bg-primary text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition-colors active:opacity-80">
                제출
            </button>
</div>
</div>
</main>
</body></html>
